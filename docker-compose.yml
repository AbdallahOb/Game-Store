services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gamestore}
      POSTGRES_USER: ${POSTGRES_USER:-gamestore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gamestore}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gamestore}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Optional - only needed for the full one-shot stack (`docker compose up`).
  # For local development, just run `docker compose up -d db` and run the
  # backend/frontend yourself (see README.md) so you get hot reload.
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-4200}:80"

volumes:
  postgres_data:
